name: deploy

# Main deploy: Terraform (synced table) -> wait for sync -> Liquibase (grants + indexes).
# This is the exact sequence in scripts/deploy.sh, which you can also run locally.
# REFERENCE ONLY -- not wired to run by default. See RUNBOOK.md "CI auth" for the
# recommended OIDC / Workload Identity Federation setup before enabling it.
# Manual trigger only so it never auto-fails on a runner that can't reach the workspace.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}         # service principal
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }} # OAuth (M2M)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false
      - uses: liquibase/setup-liquibase@9bd28bc8b31bd5a1651b34c7856569d5392ee869 # v3.0.0
        with:
          version: "4.33.0"
          edition: "community"
      - name: Set up Databricks CLI
        uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7 # v1.19.0
        with:
          version: "1.19.0"
      - name: Deploy (terraform apply -> wait sync -> liquibase update)
        run: ./scripts/deploy.sh
        env:
          PROFILE: ""   # empty => omit -p; CLI uses DATABRICKS_* env auth
          PGUSER: ${{ secrets.DATABRICKS_CLIENT_ID }}
