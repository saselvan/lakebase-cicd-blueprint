name: pr-cleanup

# Delete the PR's ephemeral Lakebase branch when the PR closes. (Branches also auto-expire
# via their TTL, so this is belt-and-suspenders.)
# REFERENCE ONLY -- not wired (see RUNBOOK.md "CI auth"). Manual trigger only.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      PROJECT: my-lakebase-project
    steps:
      - name: Set up Databricks CLI
        uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7 # v1.19.0
        with:
          version: "1.19.0"
      - name: Delete branch
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          databricks postgres delete-branch "projects/$PROJECT/branches/pr-${PR_NUMBER}" || true
