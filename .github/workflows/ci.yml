name: CI (no-cloud checks)

# Defines the no-cloud checks (runs on PRs and pushes to main where GitHub Actions is enabled;
# on the databricks-solutions org repo Actions is disabled by default until an org admin enables
# it, so run the local gate in CONTRIBUTING.md before opening a PR). No secrets, no Databricks
# workspace — just static validation and Docker proofs so any fork can run it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: terraform
        run: |
          terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Shell scripts (syntax + shellcheck errors)
        run: |
          for s in scripts/*.sh; do bash -n "$s"; done
          shellcheck --severity=error scripts/*.sh

      - name: Validate config tables.json
        run: |
          python3 -c "import json; json.load(open('config/tables.json'))"
          echo "config/tables.json is valid JSON"

      - name: Liquibase changelogs — drift check + offline validate (no database)
        run: |
          # 1) Drift gate: the committed liquibase/generated/*.changelog.sql must byte-match a
          #    fresh generation from config/tables.json (single source of truth). Writes nothing.
          python3 liquibase/generate_changelogs.py --check
          # 2) Offline-validate EACH generated per-table changelog (no database).
          for f in liquibase/generated/*.changelog.sql; do
            echo "--- validate $f ---"
            docker run --rm -v "$PWD/liquibase/generated:/work" liquibase/liquibase:4.33 \
              --search-path=/work \
              --changeLogFile="$(basename "$f")" \
              --url="offline:postgresql?version=16" \
              validate
          done

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # The gitleaks CLI (MIT), pinned and checksum-checked. gitleaks-action needs a license key on org accounts.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  # DABs variant: offline `databricks bundle validate` — no secrets, no workspace.
  # Runs the codegen, then validates the generated bundle (dev + prod, --strict)
  # against a localhost workspace stub so any fork can run it without cloud access.
  #
  # CLI PIN: dabs/scripts/offline_validate.sh enforces Databricks CLI >= 1.5.0.
  # The bundle resources docs (https://docs.databricks.com/aws/en/dev-tools/bundles/resources,
  # checked 2026-10-22) list postgres_synced_table (Beta) as added in CLI 1.0.0; this repo was
  # tested with CLI 1.17.0 and 1.19.0, and CI pins 1.19.0 below.
  dabs-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up Databricks CLI
        uses: databricks/setup-cli@9230f12203ef173d0b901846f62a55ce997efef7 # v1.19.0
        with:
          version: "1.19.0"

      - name: Verify Databricks CLI version
        run: databricks version

      - name: Install Python deps (codegen + tests)
        run: pip install "pyyaml==6.0.2" "pytest==9.1.1"

      - name: Verify committed dabs/resources match config (drift check — no overwrite)
        run: python3 -m dabs.generate_resources --check

      - name: Offline bundle validate gate (drift check + temp codegen -> validate --strict dev+prod -> resource count)
        run: bash dabs/scripts/offline_validate.sh

      - name: Falsifiability tests — validate passes on valid, FAILS on malformed/invalid resource
        run: pytest dabs/tests -q

      # The database resolver asks `terraform console`; the differential test runs it for real.
      - name: Set up Terraform (pinned; same version as the validate job)
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Offline tests — deploy scripts and Liquibase codegen (stub CLI and psql, no cloud)
        run: pytest scripts/tests liquibase/tests -q

  # State-level proofs against a real Docker PostgreSQL — no cloud, no Lakebase, no secrets.
  # Each script asserts on actual database state (roles, grants, indexes, views) so the fixed
  # migration bug classes cannot silently regress:
  #   - multi-table shared-schema changeset identity (per-table changelogs)
  #   - renderer double-apply idempotency, no version-table rollback
  #   - deploy verify step actually fails on a missing grant/index
  # Ubuntu runners ship Docker and Java; the proofs stay OUT of pytest so the offline suite is
  # Docker-free. Run the same scripts locally with `bash <path>`.
  docker-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install psql client (the proofs run psql from the host)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Liquibase 4.33.0 (matches the offline-validate image; bundles the pg driver)
        uses: liquibase/setup-liquibase@9bd28bc8b31bd5a1651b34c7856569d5392ee869 # v3.0.0
        with:
          version: "4.33.0"
          edition: "community"

      - name: Proof — Liquibase multi-table shared schema, both roles/views created
        run: bash liquibase/tests/docker_multitable_proof.sh

      - name: Proof — a changed consumer view applies on the next deploy (runAlways reruns, no checksum error)
        run: bash liquibase/tests/docker_view_edit_proof.sh

      - name: Proof — DABs renderer double-apply is a clean reconciling no-op
        run: bash dabs/tests/docker_double_apply_proof.sh

      - name: Proof — deploy verify step exits non-zero on a missing grant or index
        run: bash scripts/tests/docker_verify_step.sh

      - name: Proof — consumer view survives base-table column changes atomically on both paths
        run: bash liquibase/tests/docker_view_column_change_proof.sh
