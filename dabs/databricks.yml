# Lakebase CI/CD — DABs variant (the documented lead; Terraform+Liquibase is the portable alt).
#
# REQUIRES Databricks CLI >= 1.5.0. The Lakebase DAB resources used here
# (postgres_synced_tables, postgres_roles) are BETA — CLIs older than 1.5.0 drop the resource
# `role_id`, so this pin is a correctness requirement. The offline PR CI (ci.yml, `dabs-validate`
# job) installs a pinned CLI and runs `bundle validate` with no secrets.
#
# Resources are GENERATED from the single source of truth config/tables.json by
# `python -m dabs.generate_resources` (ticket 01) into resources/*.yml — re-run codegen after
# editing tables.json; do not hand-edit the generated files.
bundle:
  name: lakebase-cicd-dabs

include:
  - resources/*.yml

# --- Migration Workflow job (ticket 03) -------------------------------------------------------
# STATIC resource (not table-driven), so it lives inline here rather than under resources/*.yml —
# which is 100% codegen-owned and drift-checked; a hand-written file there would trip the guard.
#
# The task runs dabs/migration_job.py on SERVERLESS Python compute (no Java, so Alembic not
# Liquibase — ADR 0006/D1). At run time it: reads config/tables.json, BLOCKS until every synced
# table reports ONLINE (ADR 0003), then applies the SHARED alembic/ migration via a RUNTIME OAuth
# token minted inside the workspace (no stored secret). It loops config/tables.json at run time —
# exactly like the migration — so adding a table needs no job edit. The live run is ticket 04.
#
# config/ and alembic/ live at the repo root (above this bundle root), so sync.paths pulls them
# into the deployment alongside dabs/ (the task shells out to `alembic upgrade head --sql`).
sync:
  paths:
    - .
    - ../alembic
    - ../config

resources:
  jobs:
    lakebase_migration:
      name: "lakebase-cicd migration (${bundle.target})"
      tasks:
        - task_key: alembic_migrate
          spark_python_task:
            # Relative to the synced bundle root; migration_job.py syncs from dabs/, i.e. the
            # entrypoint lands at ${workspace.file_path}/dabs/migration_job.py.
            python_file: ./migration_job.py
            # The task runs via exec(compile(...)) where __file__ is UNDEFINED, so the entrypoint
            # can't locate config/ or alembic/ off __file__. We pass their DEPLOYED locations
            # explicitly via bundle interpolation: sync.paths puts config/ and alembic/ at the
            # files root (siblings of dabs/), so ${workspace.file_path}/{config,alembic} is where
            # they land. Interpolated at deploy time — credential-free, no literal path committed.
            parameters:
              - "--config"
              - "${workspace.file_path}/config/tables.json"
              - "--alembic-dir"
              - "${workspace.file_path}/alembic"
              - "--instance"
              - "${var.lakebase_instance}"
          environment_key: migration
      environments:
        - environment_key: migration
          spec:
            client: "2"
            dependencies:
              - alembic>=1.13
              - psycopg[binary]>=3.1
              - databricks-sdk>=0.133
      queue:
        enabled: true

variables:
  lakebase_branch:
    description: Lakebase project branch the app roles live on.
    default: projects/PLACEHOLDER/branches/main
  lakebase_database:
    description: Lakebase Postgres database that hosts the synced tables.
    default: databricks_postgres
  lakebase_instance:
    description: Lakebase database instance the migration job connects to (runtime OAuth, no
      stored secret). Overridden per environment at deploy time — no workspace-specific value
      is committed.
    default: PLACEHOLDER_INSTANCE

# Environments are selected with `--target dev|prod`; switching targets changes only the
# deployment mode, never the resources. No workspace host/URL/profile is committed here
# (public-safe): the workspace binding is supplied at RUNTIME so adopters and forkers use their
# own auth without editing this file. Pick one:
#   - a CLI profile:      databricks bundle validate -p my-dev-profile   --target dev
#   - env auth:           DATABRICKS_HOST=... DATABRICKS_TOKEN=...        databricks bundle validate --target dev
# Offline PR CI (no secrets) points DATABRICKS_HOST at a localhost stub that answers the one
# SCIM `Me` call validate makes (see the `dabs-validate` job in .github/workflows/ci.yml +
# dabs/tests/mock_workspace.py).
targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
    workspace:
      # Deterministic, per-principal deploy root (production best practice: exactly one copy).
      # Interpolated at runtime from the resolved identity — no committed workspace value.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
