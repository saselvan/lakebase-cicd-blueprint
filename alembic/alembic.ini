# Alembic configuration for the Lakebase CI/CD reference (Python variant).
#
# This module generates migration SQL OFFLINE (`alembic upgrade head --sql`) — it needs
# NO live database and stores NO secrets. The URL below is a dummy that only tells Alembic
# which SQL dialect to render; nothing ever connects to it. Real deploys pipe the emitted
# SQL to psql (see the README "Alembic (Python) alternative" section).

[alembic]
# Location of env.py and versions/, relative to this file's directory.
script_location = .

# Make the alembic/ directory importable so env.py / migrations can share helpers.
prepend_sys_path = .

# Left intentionally blank: OFFLINE --sql only needs a SQL *dialect*, not a real
# connection. env.py supplies a dialect-only URL (no host, no credentials). Never put
# a real connection string here — a deploy overrides the URL out-of-band.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
